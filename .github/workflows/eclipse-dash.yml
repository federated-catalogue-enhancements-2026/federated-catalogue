name: Call Eclipse Dash License Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'
  release:
    types: [published]
    
permissions:
  contents: read
  actions: write
  
jobs:
  call-remote-dash-workflow:
    uses: eclipse-xfsc/dev-ops/.github/workflows/eclipse-dash-licence-maven.yml@main
    secrets: inherit
    with: 
      java_version: '21'

  vendored-assets-dash-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build Dash coordinates file for vendored assets
        run: ./fc-tools/scan-vendored-assets.sh --dash-coordinates > /tmp/vendored.deps

      - name: Download Eclipse Dash license tool
        run: |
          curl -sSfL --proto '=https' --proto-redir '=https' \
            -o dash-licenses.jar \
            "https://repo.eclipse.org/service/rest/v1/search/assets/download?sort=version&repository=dash-maven2-releases&maven.groupId=org.eclipse.dash&maven.artifactId=org.eclipse.dash.licenses&maven.extension=jar"
          file dash-licenses.jar

      - name: Run Dash scan against vendored-asset coordinates
        run: |
          java -Dorg.slf4j.simpleLogger.defaultLogLevel=debug -jar dash-licenses.jar /tmp/vendored.deps \
            -summary vendored-assets-DEPENDENCIES

      - name: Upload vendored-assets Dash summary
        if: always() && hashFiles('vendored-assets-DEPENDENCIES') != ''
        uses: actions/upload-artifact@v4
        with:
          name: vendored-assets-dependencies-summary
          path: vendored-assets-DEPENDENCIES
          retention-days: 90
          if-no-files-found: error
